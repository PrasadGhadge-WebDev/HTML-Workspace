<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Register Page For Job</title>
</head>

<body>

    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:#1e293b; color:#fff; margin-bottom:20px; border-radius:8px;">
        <a href="../tasks.html" style="text-decoration:none; background:#38bdf8; color:#0f172a; padding:7px 16px; border-radius:6px; font-weight:bold; font-size:14px;">⬅ Back to Tasks</a>
        <h1 style="margin:0; font-size:22px;"><mark style="background:#fef08a; padding:2px 8px; border-radius:4px;">Job Registration Form</mark></h1>
        <div style="width:120px;"></div>
    </div>

    <center>

        <form action="" method="post">

            <table cellpadding="8">

                <tr>
                    <td><label for="fullname">Full Name:</label></td>
                    <td>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter Full Name" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email:</label></td>
                    <td>
                        <input type="email" id="email" name="email" placeholder="Enter Email" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="mobile">Mobile Number:</label></td>
                    <td>
                        <input type="tel" id="mobile" name="mobile" placeholder="Enter Mobile Number" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td>
                        <input type="date" id="dob" name="dob" required>
                    </td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="male">Male</label>

                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>
                    </td>
                </tr>

                <tr>
                    <td><label for="qualification">Qualification:</label></td>
                    <td>
                        <select id="qualification" name="qualification" required>
                            <option value="">Select Qualification</option>
                            <option value="BCom">B.Com</option>
                            <option value="BCA">BCA</option>
                            <option value="BSc">B.Sc</option>
                            <option value="BE">B.E.</option>
                            <option value="MCA">MCA</option>
                            <option value="MBA">MBA</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Skills:</td>
                    <td>
                        <input type="checkbox" id="html" name="skills" value="HTML">
                        <label for="html">HTML</label>

                        <input type="checkbox" id="css" name="skills" value="CSS">
                        <label for="css">CSS</label>

                        <input type="checkbox" id="java" name="skills" value="Java">
                        <label for="java">Java</label>

                        <input type="checkbox" id="python" name="skills" value="Python">
                        <label for="python">Python</label>
                    </td>
                </tr>

                <tr>
                    <td><label for="experience">Experience:</label></td>
                    <td>
                        <select id="experience" name="experience">
                            <option value="">Select Experience</option>
                            <option value="Fresher">Fresher</option>
                            <option value="1-2">1 - 2 Years</option>
                            <option value="3-5">3 - 5 Years</option>
                            <option value="5+">5+ Years</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="resume">Upload Resume:</label></td>
                    <td>
                        <input type="file" id="resume" name="resume">
                    </td>
                </tr>

                <tr>
                    <td><label for="city">City:</label></td>
                    <td>
                        <input type="text" id="city" name="city" placeholder="Enter City">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Register">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </center>

</body>

</html>
