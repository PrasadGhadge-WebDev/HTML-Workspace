<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
</head>

<body>
    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:#1e293b; color:#fff; margin-bottom:20px; border-radius:8px;">
        <a href="../tasks.html" style="text-decoration:none; background:#38bdf8; color:#0f172a; padding:7px 16px; border-radius:6px; font-weight:bold; font-size:14px;">⬅ Back to Tasks</a>
        <h1 style="margin:0; font-size:22px;"><mark style="background:#fef08a; padding:2px 8px; border-radius:4px;">Register Form</mark></h1>
        <div style="width:120px;"></div>
    </div>

    <center>

        <form action="" method="post">

            <table cellpadding="8">

                <tr>
                    <td><label for="fullname">Full Name:</label></td>
                    <td>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter Full Name" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="username">Username:</label></td>
                    <td>
                        <input type="text" id="username" name="username" placeholder="Enter Username" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email:</label></td>
                    <td>
                        <input type="email" id="email" name="email" placeholder="Enter Email" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="password">Password:</label></td>
                    <td>
                        <input type="password" id="password" name="password" placeholder="Enter Password" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td>
                        <input type="date" id="dob" name="dob" required>
                    </td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="male">Male</label>

                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>
                    </td>
                </tr>

                <tr>
                    <td><label for="profile-pic">Profile Picture:</label></td>
                    <td>
                        <input type="file" id="profile-pic" name="profile-pic">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Register">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </center>

</body>

</html>
